name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "ubuntu / gcc" }
          - { os: macos-latest,  label: "macos / clang" }
    steps:
      - uses: actions/checkout@v4

      # GNU Lightning enables the MSP430 and ARM JITs.  It is installed
      # explicitly and ASSERTED below because the build auto-detects it:
      # without it, `make` silently compiles the JITs out and the arm-jit
      # suite self-skips — which is how 410400 generated-code comparisons can
      # "pass" in 40 seconds without executing a single generated instruction.
      # That failure mode is exactly the one this suite exists for: the
      # x86-64-only `jit_andi 0x80000000` miscompile stayed green on every
      # other signal.  Pinned to 2.2.3 — the version both dev machines run,
      # and whose backend bug arm_jit.c (emit_n_bit) works around; a silent
      # version drift here should be a deliberate choice, not runner luck.
      # No usable Ubuntu package exists, so Linux builds it from source.
      - name: Install GNU Lightning (Linux, source build)
        if: runner.os == 'Linux'
        run: |
          curl -sL https://ftp.gnu.org/gnu/lightning/lightning-2.2.3.tar.gz | tar xz
          cd lightning-2.2.3
          # Same vendored mprotect fix the release workflow applies — see
          # .github/patches/.  Linux happens to run without it, but the two
          # recipes must not drift.
          patch -p1 < ../.github/patches/lightning-2.2.3-mprotect.patch
          ./configure --prefix=/usr/local > /dev/null
          make -j"$(nproc)" > /dev/null
          sudo make install > /dev/null
          sudo ldconfig

      - name: Install GNU Lightning (macOS)
        if: runner.os == 'macOS'
        run: brew install lightning

      - name: Assert Lightning is visible to the build
        run: pkg-config --exists lightning && pkg-config --modversion lightning

      - name: Build
        run: make

      - name: MSP430 instruction tests
        run: ./build/test_runner correctness

      - name: ARM instruction tests
        run: ./build/test_runner arm-correctness

      # Differential test of the JIT's decoder + reference model against the
      # interpreter: all 65536 Thumb halfwords x 6 random register/flag states.
      # Deterministic and fast (~1s), and it is the only thing that catches
      # flag-only drift between the two implementations — the failure mode
      # that is invisible until a conditional branch goes the wrong way.
      - name: ARM decoder differential tests
        run: ./build/test_runner arm-decode

      # Differential test of the GENERATED CODE against the interpreter, over
      # the same exhaustive encoding sweep.  This is not redundant with
      # arm-decode: that one validates the *description* of an instruction,
      # while the JIT ships a third implementation — the machine code GNU
      # Lightning emits — and only running it tests it, on the host it was
      # emitted for.  It is here because jit_andi(dst, src, 0x80000000) returns
      # 0 on x86-64 Lightning 2.2.3, which made every N-reading condition
      # (MI/PL/GE/LT/GT/LE) silently take the wrong branch on that host while
      # arm-decode, arm-correctness and the whole Cooja suite stayed green.
      # Skips itself cleanly when Lightning is not installed.
      - name: ARM JIT generated-code differential tests
        run: |
          set -o pipefail
          ./build/test_runner arm-jit | tee armjit.out
          if grep -q "SKIP" armjit.out; then
            echo "::error::arm-jit skipped — Lightning missing despite the install step"
            exit 1
          fi

      - name: Timeline unit tests
        run: ./build/test_runner timeline

      - name: MSP430 firmware boot tests
        run: ./build/test_runner firmware

      - name: ARM firmware boot tests
        run: ./build/test_runner arm-firmware

      - name: MSP430 multinode (2 nodes, 5s sim)
        run: ./build/test_runner multinode -n 2 -t 5000 -q

      - name: ARM multinode (CC2538 nullnet, 5s sim)
        run: ./build/test_runner arm-multinode firmware/cc2538dk/nullnet-broadcast.cc2538dk -t 5000 -q

      - name: CC1200 chip-driver mock-host tests
        run: ./build/test_runner cc1200-mock-host

      - name: Radio medium unit tests
        run: ./build/test_runner radio-medium

      - name: Radio bus unit tests
        run: ./build/test_runner radio-bus

      - name: Version smoke
        run: ./build/test_runner --version

      - name: "Plugin system (build + smoke: service, medium, energy, UI)"
        run: |
          make plugins
          tools/check-plugin.sh

      - name: cc2538dk RPL-UDP convergence (with -d 100)
        # Pins the -d (per-node startup-delay spread) mechanism end-to-end:
        # the cc2538dk RPL-UDP pair must converge with the staggered start.
        run: ./build/test_runner arm-multinode firmware/cc2538dk/udp-server.cc2538dk firmware/cc2538dk/udp-client.cc2538dk -t 30000 -d 100 -q

      - name: cc2538dk TSCH with LPM (RCOSC clock-downshift regression, 60s sim)
        # Fix-sensitive guard for the cc2538 SYS_CTRL clock bugs: this firmware
        # actually enters PM1/2, so it exercises the CLOCK_CTRL.OSC switch path
        # (unlike test-tsch-cc2538dk.json, whose firmware never lowers the
        # oscillator). On unfixed main the leaf wedges / desyncs and never joins;
        # with the cc2538_sys_ctrl fix it prints "[LEAF] reachable" (~33s sim).
        run: ./build/test_runner test configs/test-tsch-lpm-cc2538dk.json

      - name: Zoul Firefly multinode (CC1200 nullnet, 20s sim)
        # The Firefly nullnet firmware sends a broadcast every 8 s, so
        # 20 s of sim is enough to verify the CC1200 RX path: each
        # node should print at least one "Received" line.
        run: ./build/test_runner zoul-firefly-multinode firmware/zoul-firefly/nullnet-broadcast-subghz.zoul-firefly -t 20000 -q

      - name: nRF52840-DK Contiki RPL-UDP (40s sim)
        # The runner exits 0 regardless, so assert on the firmware's own
        # reception count (no -q — that suppresses the firmware console).
        run: |
          ./build/test_runner nrf52840-dk-multinode \
            firmware/nrf52840-dk/udp-server.nrf52840-dk \
            firmware/nrf52840-dk/udp-client.nrf52840-dk -t 40000 > out.txt 2>&1
          n=$(grep -ciE 'Received (request|response)' out.txt || true)
          echo "RPL-UDP receptions: $n"; [ "$n" -ge 2 ]

      - name: nRF52840-Dongle Contiki RPL-UDP (40s sim)
        run: |
          ./build/test_runner nrf52840-dongle-multinode \
            firmware/nrf52840-dongle/udp-server.nrf52840-dongle \
            firmware/nrf52840-dongle/udp-client.nrf52840-dongle -t 40000 > out.txt 2>&1
          n=$(grep -ciE 'Received (request|response)' out.txt || true)
          echo "RPL-UDP receptions: $n"; [ "$n" -ge 2 ]

      - name: nRF52840-DK Zephyr 802.15.4 echo (stock echo_server/client, 40s sim)
        # Experimental Zephyr path; the echo build has no log backend, so assert
        # on the server's own "Received and replied" line.
        run: |
          ./build/test_runner nrf52840-dk-multinode \
            firmware/nrf52840-dk/zephyr-echo-server.nrf52840-dk \
            firmware/nrf52840-dk/zephyr-echo-client.nrf52840-dk -t 40000 > out.txt 2>&1
          n=$(grep -c 'Received and replied' out.txt || true)
          echo "echo replies: $n"; [ "$n" -ge 5 ]

      - name: Determinism guard (sky RPL-UDP run twice → byte-identical)
        run: tools/check-determinism.sh multinode firmware/sky/udp-server.sky firmware/sky/udp-client.sky -t 20000

      # The JIT's core contract: CSIM_ARM_JIT=0 and =1 must produce
      # byte-identical simulation output (wall-clock lines excluded), because
      # determinism is a gated guarantee and Lightning is an optional
      # dependency — results must not depend on whether it happens to be
      # installed.
      - name: "JIT cycle-exactness: CSIM_ARM_JIT=0 vs 1 → byte-identical"
        run: |
          filter='Wall-clock|Speed ratio|Throughput|MIPS'
          CSIM_ARM_JIT=0 ./build/test_runner test configs/chain-3node-nrf52840-dk.json | grep -vE "$filter" > jit-off.txt
          ./build/test_runner test configs/chain-3node-nrf52840-dk.json | grep -vE "$filter" > jit-on.txt
          grep -q "TEST PASSED" jit-on.txt
          cmp jit-off.txt jit-on.txt

      # Lockstep verification on real firmware: every compiled block is run,
      # rewound (registers + APSR + cycles + SRAM), re-executed interpreted,
      # and compared exactly.  Complements arm-jit, which is exhaustive over
      # single encodings but never runs multi-instruction blocks — this is
      # the only automated coverage of block composition.
      - name: JIT lockstep verify (cc2538 RPL-UDP, 10 s sim)
        run: |
          CSIM_ARM_JIT_VERIFY=1 ./build/test_runner arm-multinode \
            firmware/cc2538dk/udp-server.cc2538dk firmware/cc2538dk/udp-client.cc2538dk \
            -t 10000 -q > verify.txt 2>&1
          n=$(grep -c "MISMATCH" verify.txt || true)
          echo "lockstep mismatches: $n"
          [ "$n" -eq 0 ]

      # TSCH is the timing-sensitive canary: association + sustained sync
      # depend on per-byte RX delivery landing on exact cycles, so it is the
      # first thing to break if anything shifts an event.  The nRF52840
      # config simulates ~25 s and runs in seconds; the ~240 s cc2538 variant
      # stays out of PR CI on runtime grounds.
      - name: TSCH association + sync (nRF52840-DK)
        run: |
          ./build/test_runner test configs/test-tsch-nrf52840-dk.json > tsch.txt 2>&1
          tail -5 tsch.txt
          grep -aq "TEST PASSED" tsch.txt

      - name: Config v1 <-> v2 equivalence (chain-4node-sky)
        run: tools/check-config-equivalence.sh configs/chain-4node-sky.json configs/chain-4node-sky-v2.json

      # Lightning is optional by design; now that CI installs it, this is the
      # only coverage the no-Lightning build path has.  Rebuild with the
      # detection overridden, prove the interpreter suites still pass and that
      # arm-jit skips itself cleanly instead of failing.
      - name: Build without Lightning still works (JIT compiled out)
        if: runner.os == 'Linux'
        run: |
          make clean > /dev/null
          make LIGHTNING_CFLAGS= LIGHTNING_LIBS= -j"$(nproc)" > /dev/null
          ./build/test_runner arm-correctness
          ./build/test_runner arm-jit | grep -q "SKIP"

name: tests

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the MSP430 firmware that lives outside the repo. The .sky/.z1
  # binaries used by `firmware`/`multinode` tests are intentionally NOT
  # committed (see 1089e7d: "remove stale prebuilt binaries"). CI rebuilds
  # them via the contiker/contiki-ng:latest toolchain image and uploads
  # them as an artifact for the test jobs to download.
  #
  # The cc2538dk, zoul-firefly, nrf52840-dk, nrf54l15-dk, nrf52840-dongle
  # ARM firmware *is* committed (each board's PROVENANCE.md records the
  # provenance), so this job only has to rebuild MSP430 binaries.
  build-msp430-firmware:
    name: build msp430 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # actions/checkout@v4 rejects `path: '../contiki-ng'` (outside the
      # workspace). Clone into the workspace and pass an absolute path to
      # build-device-firmware.sh's --contiki-dir so Docker can mount it.
      - name: Checkout Contiki-NG (workspace dir)
        uses: actions/checkout@v4
        with:
          repository: contiki-ng/contiki-ng
          submodules: recursive
          path: contiki-ng-src

      - name: Pull contiker image
        run: docker pull contiker/contiki-ng:latest

      - name: Build firmware/sky/nullnet-broadcast.sky
        run: |
          ./tools/build-device-firmware.sh \
              --target sky \
              --example examples/nullnet \
              --source-file nullnet-broadcast \
              --output firmware/sky/nullnet-broadcast.sky \
              --contiki-dir "$GITHUB_WORKSPACE/contiki-ng-src" \
              --no-provenance

      # Other MSP430 fixtures (`cputest.sky`, `timertest.sky`) used by the
      # `firmware` boot-test step are not in upstream Contiki-NG — the boot
      # test silently skips them when absent (see test/test_firmware.c).
      # If/when they land upstream, add `--example examples/dev/cpu-test`
      # and `--example examples/dev/timer-test` build steps here.

      - name: Show built firmware
        run: ls -la firmware/sky/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: msp430-firmware
          path: firmware/sky/*.sky
          retention-days: 1

  test:
    name: ${{ matrix.label }}
    needs: build-msp430-firmware
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: "ubuntu / gcc" }
          - { os: macos-latest,  label: "macos / clang" }
    steps:
      - uses: actions/checkout@v4

      - name: Download MSP430 firmware
        uses: actions/download-artifact@v4
        with:
          name: msp430-firmware
          path: firmware/sky/

      - name: Build
        run: make

      - name: MSP430 instruction tests
        run: ./build/test_runner correctness

      - name: ARM instruction tests
        run: ./build/test_runner arm-correctness

      - name: Timeline unit tests
        run: ./build/test_runner timeline

      - name: MSP430 firmware boot tests
        run: ./build/test_runner firmware

      - name: ARM firmware boot tests
        run: ./build/test_runner arm-firmware

      - name: MSP430 multinode (2 nodes, 5s sim)
        run: ./build/test_runner multinode -n 2 -t 5000 -q

      - name: ARM multinode (CC2538 nullnet, 5s sim)
        run: ./build/test_runner arm-multinode firmware/cc2538dk/nullnet-broadcast.cc2538dk -t 5000 -q

      - name: CC1200 chip-driver mock-host tests
        run: ./build/test_runner cc1200-mock-host

      - name: Radio medium unit tests
        run: ./build/test_runner radio-medium

      - name: cc2538dk RPL-UDP convergence (with -d 100)
        # Pins the -d (per-node startup-delay spread) mechanism end-to-end:
        # the cc2538dk RPL-UDP pair must converge with the staggered start.
        run: ./build/test_runner arm-multinode firmware/cc2538dk/udp-server.cc2538dk firmware/cc2538dk/udp-client.cc2538dk -t 30000 -d 100 -q

      - name: Zoul Firefly multinode (CC1200 nullnet, 20s sim)
        # The Firefly nullnet firmware sends a broadcast every 8 s, so
        # 20 s of sim is enough to verify the CC1200 RX path: each
        # node should print at least one "Received" line.
        run: ./build/test_runner zoul-firefly-multinode firmware/zoul-firefly/nullnet-broadcast-subghz.zoul-firefly -t 20000 -q

# TODO: add a third job that builds with GNU Lightning enabled to cover
# the JIT path in src/msp430/msp430_jit.c. Verify the Ubuntu apt package
# name first (`apt-cache search lightning` on the runner) — Debian/Ubuntu
# has historically shipped GNU Lightning under different names.

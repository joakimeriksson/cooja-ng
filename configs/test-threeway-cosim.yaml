# Three independent simulators, three instruction sets, one radio medium,
# one lockstep timeline -- carrying IETF protocols, not example glue.
#
#   Renode      emulates a CC2538 (ARM Cortex-M3) and OWNS THE CLOCK
#   csim        emulates a Tmote Sky (MSP430, 16-bit) and OWNS THE MEDIUM
#   esp32sim    emulates an ESP32-C6 (RISC-V, 32-bit) in its own process
#
# csim is a clock *slave* to Renode and a clock *master* to esp32sim at the
# same time. The time authority is a chain: Renode -> csim -> esp32sim.
#
# The network is the standard Contiki-NG stack on every node: IPv6 over
# 6LoWPAN, RPL Lite routing, UDP. The Sky is the RPL root and UDP server; the
# ESP32-C6 is a client that must join the DAG and complete request/response
# round trips through it. That requires unicast with link-layer
# acknowledgements and 6LoWPAN header compression to interoperate between a
# 16-bit MSP430 and a 32-bit RISC-V running different vendor SDKs.
#
# Run it (Renode starts csim, csim starts esp32sim):
#   CSIM_CONFIG=$PWD/configs/test-threeway-cosim.yaml \
#       renode examples/renode/cc2538-csim-rpl.resc
#
# Without --renode this is a two-simulator csim+esp32sim run, which is what
# the validators below assert.
title: "Three-way co-simulation over 6LoWPAN/RPL/UDP: Renode + csim + esp32sim"
timeout_ms: 120000
seed: 42
startup_delay_ms: 1000

radiomedium:
  type: udgm
  tx_range: 55.0
  interference_range: 110.0
  success_ratio_tx: 1.0
  success_ratio_rx: 1.0

nodes:
  # csim's own emulated node: MSP430, 16-bit. RPL root + UDP server.
  - { firmware: firmware/sky/udp-server.sky,      id: 1, x: 0.0, y: 0.0 }
  # esp32sim, a separate process: RISC-V, 32-bit, unmodified ESP-IDF image
  # running the same Contiki-NG rpl-udp client.
  - { firmware: examples/ext/esp32c6-rpl.py,      id: 2, x: 3.0, y: 0.0 }
  # Renode's CC2538, as seen from csim. Its frames arrive over the
  # co-simulation window; the same window carries the tick clock.
  - { firmware: dev.renode,                        id: 3, x: 1.5, y: 0.0 }

test:
  timeout_is_success: true
  validators:
    # A UDP request that reached the MSP430 root can only have come from the
    # RISC-V client in the other process, over 6LoWPAN and RPL.
    - { pattern: "Received request", node: 1, min_count: 2 }
    # And the reply has to make it back.
    - { pattern: "Received response", node: 2, min_count: 2 }

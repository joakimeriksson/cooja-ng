# nRF54L15 TrustZone-M split image: one node, two ELFs.  The mote type's
# secure_firmware is the Secure-world image, loaded first; firmware is the
# Non-secure world.  Boot starts in the Secure world (VTOR = 0).

version: 2
title: "nRF54L15 TrustZone-M split-image boot (XIAO nRF54L15)"
timeout_ms: 35000
seed: 42          # same seed => byte-identical run

mote_types:
  - { name: normal-world-example, firmware: firmware/nrf54l15-xiao/normal-world-example.nrf54l15-xiao, secure_firmware: firmware/nrf54l15-xiao/secure-world-example.nrf54l15-xiao }

nodes:
  - { type: normal-world-example, id: 1, x: 0.0, y: 0.0 }

test:
  description: >
    One node, two ELFs: the Secure world (SAU/SPU/MPC/ITNS setup, watchdog
    owner, console) hands off via BLXNS to the minimal-platform Non-secure
    world, which registers the TZ API through SG veneers and runs its etimer
    loop (one 'Iteration' line per 10 s). The hand-off and API registration
    happen during node init (the runner prints 'secure world handed off to the
    normal world'); the test itself waits for two normal-world iterations, each
    of which is printed through the tz_api_println SG veneer, so the step
    proves the NS scheduler, the NS GRTC tick and the NS->S->NS round trip. Any
    permission or SPU-violation message fails it.
  steps:
    - { wait: Iteration, node: 1, count: 2 }
  fail_on:
    - "Non-secure image has incorrect permissions"
    - "Initialize TrustZone API: FAILURE"
    - "Not jumping to the normal world"
    - "Invalid non-secure pointer"
    - "Reboot caused by SPU violation"

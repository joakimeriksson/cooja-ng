# Two csim clients of different architectures join an RPL DAG rooted in Renode.
#
# Renode emulates a CC2538 (Cortex-M3) running the rpl-udp SERVER -- the DAG
# root. csim emulates a Tmote Sky (MSP430, 16-bit) and an nRF52840 (Cortex-M4F)
# both running the rpl-udp CLIENT. Each has to hear the root's DIOs, register
# with a unicast, acknowledged DAO, and complete UDP request/response round
# trips through the root. Two ISAs on csim's side, a third in Renode, one
# 6LoWPAN/RPL network.
#
# Verified against Renode 1.17: the root serves both clients from their own
# IPv6 addresses (fd00::212:7401:1:101 and fd00::f6ce:3602:e3e9:2).
#
#   CSIM_CONFIG=$PWD/configs/test-renode-root-rpl-2clients.yaml \
#       renode examples/renode/cc2538-csim-rpl.resc      # with $id = 3
title: "RPL root in Renode (CC2538); Sky + nRF52840 clients in csim"
timeout_ms: 150000
seed: 42
startup_delay_ms: 1000

radiomedium:
  type: udgm
  tx_range: 55.0
  interference_range: 110.0
  success_ratio_tx: 1.0
  success_ratio_rx: 1.0

nodes:
  - { firmware: firmware/sky/udp-client.sky,                 id: 1, x:  0.0, y: 0.0 }
  - { firmware: firmware/nrf52840-dk/udp-client.nrf52840-dk, id: 2, x: 20.0, y: 0.0 }
  # Renode's CC2538 root, as seen from csim; in range of both clients.
  - { firmware: dev.renode,                                  id: 3, x: 10.0, y: 0.0 }

test:
  timeout_is_success: true
  validators:
    - { pattern: "Received response", node: 1, min_count: 1 }
    - { pattern: "Received response", node: 2, min_count: 1 }
